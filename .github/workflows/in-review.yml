name: Auto Assign Reviewers

on:
  workflow_dispatch:
  project_card:
    types: [moved]

jobs:
  assign_reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewers = ["lolgufdhd"];
            let cards = [];

            if (context.eventName === "workflow_dispatch") {
              const { data: projects } = await github.rest.projects.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const project = projects.find(p => p.name === "TO-DOs");
              if (!project) return;

              const { data: columns } = await github.rest.projects.listColumns({
                project_id: project.id
              });
              const inReviewColumn = columns.find(c => c.name === "In review");
              if (!inReviewColumn) return;

              const { data } = await github.rest.projects.listCards({
                column_id: inReviewColumn.id
              });
              cards = data;
            } 
            
            if (context.eventName === "project_card") {
              const card = context.payload.project_card;
              const columnName = context.payload.project_column.name;
              const projectId = card.project_id;
              const projectData = await github.rest.projects.get({ project_id: projectId });
              const projectName = projectData.data.name;

              if (projectName === "TO-DOs" && columnName === "In review") {
                cards = [card];
              }
            }

            for (const card of cards) {
              if (!card.content_url) continue;
              const issue_number = parseInt(card.content_url.split("/").pop());

              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              });

              if (issue.assignees.length === 0) {
                const assignee = reviewers[Math.floor(Math.random() * reviewers.length)];
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  assignees: [assignee]
                });
              }
            }
